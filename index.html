  function attachOverviewHandlers() {
    const addBtn = document.getElementById('add-mat-btn'); if (addBtn) addBtn.onclick = handleAddMaterial;
    const fileInput = document.getElementById('mat-file'); if (fileInput) fileInput.onchange = handleMaterialFile;
    const buildBtn = document.getElementById('build-btn'); if (buildBtn) buildBtn.onclick = buildToday;
    document.getElementById('material-grid').addEventListener('click', (e) => {
      const del = e.target.closest('[data-delete]');
      if (del) { e.stopPropagation(); removeMaterial(del.dataset.delete).then(renderApp); return; }
      const card = e.target.closest('.notebook-card');
      if (card) {
        const m = state.materials.find(x => x.id === card.dataset.id);
        if (m && m.lesson) { state.activeMaterialId = m.id; state.view = 'lesson'; renderApp(); }
      }
    });
    const saveKeyBtn = document.getElementById('save-key-btn');
    if (saveKeyBtn) saveKeyBtn.onclick = async () => {
      const val = document.getElementById('api-key-input').value.trim();
      state.apiKey = val;
      await storageSet('api-key', val);
      renderOverview(document.getElementById('view'));
    };
    const clearKeyBtn = document.getElementById('clear-key-btn');
    if (clearKeyBtn) clearKeyBtn.onclick = async () => {
      state.apiKey = '';
      await storageDelete('api-key');
      renderOverview(document.getElementById('view'));
    };
  }

  async function handleAddMaterial() {
    const title = document.getElementById('mat-title').value.trim();
    const text = document.getElementById('mat-text').value.trim();
    const errEl = document.getElementById('mat-error');
    if (!text) { errEl.textContent = 'Paste some text or upload a file first.'; return; }
    await addMaterial({ title, content: text });
    renderOverview(document.getElementById('view'));
  }

  async function handleMaterialFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const errEl = document.getElementById('mat-error');
    errEl.textContent = 'Reading file…';
    try {
      let text;
      if (file.name.toLowerCase().endsWith('.pdf')) text = await extractPdfText(file);
      else text = await file.text();
      document.getElementById('mat-text').value = text;
      const titleEl = document.getElementById('mat-title');
      if (!titleEl.value) titleEl.value = file.name.replace(/\.[^.]+$/, '');
      errEl.textContent = '';
    } catch (err) {
      errEl.textContent = "Couldn't read that PDF automatically — try pasting the text instead.";
    }
  }

  // ---------- lesson tab ----------
  function renderLesson(view) {
    const ready = state.materials.filter(m => m.lesson);
    if (ready.length === 0) { view.innerHTML = `<p class="empty-note">No lessons yet. Add materials and hit "Build today's plan" from the Overview tab.</p>`; return; }
    if (!state.activeMaterialId || !ready.find(m => m.id === state.activeMaterialId)) state.activeMaterialId = ready[0].id;
    const material = ready.find(m => m.id === state.activeMaterialId);

    view.innerHTML = `
      ${ready.length > 1 ? `<div class="subject-pills" id="subject-pills">${ready.map(m => `<button type="button" class="pill ${m.id === material.id ? 'active' : ''}" data-mat="${m.id}">${escapeHTML(m.title)}</button>`).join('')}</div>` : ''}
      <div id="lesson-body"></div>
    `;
    if (ready.length > 1) {
      document.getElementById('subject-pills').addEventListener('click', (e) => {
        const btn = e.target.closest('.pill'); if (!btn) return;
        stopNarration(); state.quizMode = null; state.quizRuntime = null;
        state.activeMaterialId = btn.dataset.mat;
        renderLesson(document.getElementById('view'));
      });
    }
    renderLessonBody(material);
  }

  function renderLessonBody(material) {
    const body = document.getElementById('lesson-body');
    const segIdx = material.lesson.segments.findIndex(s => !s.completed);

    if (segIdx === -1) {
      if (!material.lesson.finalQuiz.completed) {
        if (state.quizMode === 'final') renderFinalQuiz(body, material);
        else renderFinalQuizIntro(body, material);
      } else renderLessonComplete(body, material);
      return;
    }

    const segment = material.lesson.segments[segIdx];
    if (state.quizMode === 'segment' && state.quizSegmentId === segment.id) { renderSegmentQuiz(body, material, segment); return; }

    body.innerHTML = `
      <div class="segment-dots">${material.lesson.segments.map((s, i) => `<span class="segment-dot ${s.completed ? 'done' : (i === segIdx ? 'current' : '')}"></span>`).join('')}</div>
      <div class="quiz-card">
        <div class="quiz-topline"><span>Segment ${segIdx + 1} of ${material.lesson.segments.length}</span><span>${escapeHTML(material.title)}</span></div>
        <h2 class="segment-label">${escapeHTML(segment.label)}</h2>
        <div class="board" id="lesson-board"></div>
        <div class="narration-controls">
          <button type="button" class="btn-primary" id="play-btn">${state.speaking && !state.paused ? '⏸ Pause' : (state.paused ? '▶ Resume' : '▶ Play walkthrough')}</button>
          <button type="button" class="file-btn" id="stop-btn">■ Stop</button>
          <select id="voice-select" title="Narration voice"></select>
        </div>
        <button type="button" class="btn-primary" id="start-quiz-btn">Take segment quiz →</button>
      </div>
    `;
    renderBoard(segment);
    populateVoiceSelect();
    document.getElementById('play-btn').onclick = () => toggleNarration(segment);
    document.getElementById('stop-btn').onclick = () => { stopNarration(); renderLessonBody(material); };
    document.getElementById('voice-select').onchange = (e) => { state.selectedVoiceName = e.target.value; };
    document.getElementById('start-quiz-btn').onclick = () => {
      stopNarration();
      state.quizMode = 'segment'; state.quizSegmentId = segment.id; state.quizRuntime = { index: 0, selected: null, correctCount: 0 };
      renderLessonBody(material);
    };
  }

  function renderSegmentQuiz(body, material, segment) {
    const rt = state.quizRuntime;
    const q = segment.quiz[rt.index];
    const choicesHTML = q.choices.map((c, i) => {
      let cls = 'choice';
      if (rt.selected !== null) { if (i === q.correctIndex) cls += ' correct'; else if (i === rt.selected) cls += ' wrong'; }
      return `<button type="button" class="${cls}" data-choice="${i}" ${rt.selected !== null ? 'disabled' : ''}>${renderMathText(c)}</button>`;
    }).join('');
    body.innerHTML = `
      <div class="quiz-card">
        <div class="quiz-topline"><span>${escapeHTML(segment.label)} quiz — Q${rt.index + 1}/${segment.quiz.length}</span></div>
        <p class="quiz-question">${renderMathText(q.question)}</p>
        <div class="choices">${choicesHTML}</div>
        ${rt.selected !== null ? `
          <div class="feedback"><div class="xp-gain">${rt.selected === q.correctIndex ? `+${POINTS.segCorrect} stars` : `+${POINTS.segWrong} stars`}</div>${renderMathText(q.explanation)}</div>
          <button type="button" class="btn-primary" id="next-q-btn">${rt.index + 1 < segment.quiz.length ? 'Next question' : 'Finish segment'}</button>
        ` : ''}
      </div>
    `;
    body.querySelectorAll('[data-choice]').forEach(btn => {
      btn.onclick = () => {
        if (rt.selected !== null) return;
        rt.selected = Number(btn.dataset.choice);
        if (rt.selected === q.correctIndex) rt.correctCount += 1;
        renderSegmentQuiz(body, material, segment);
      };
    });
    const nextBtn = document.getElementById('next-q-btn');
    if (nextBtn) nextBtn.onclick = () => {
      if (rt.index + 1 < segment.quiz.length) { rt.index += 1; rt.selected = null; renderSegmentQuiz(body, material, segment); }
      else finishSegmentQuiz(material, segment);
    };
  }

  async function finishSegmentQuiz(material, segment) {
    const rt = state.quizRuntime;
    const points = await recordSegmentQuiz(material, segment, rt.correctCount, segment.quiz.length);
    state.quizMode = null; state.quizSegmentId = null; state.quizRuntime = null;
    renderApp();
    showPointsToast(points, 'Segment complete');
  }

  function renderFinalQuizIntro(body, material) {
    body.innerHTML = `
      <div class="quiz-card result">
        <div class="result-label">All segments done</div>
        <h2>Final check-in</h2>
        <p class="muted">${material.lesson.finalQuiz.questions.length} questions covering everything in "${escapeHTML(material.title)}".</p>
        <button type="button" class="btn-primary" id="start-final-btn">Take final quiz →</button>
      </div>
    `;
    document.getElementById('start-final-btn').onclick = () => {
      state.quizMode = 'final'; state.quizRuntime = { index: 0, selected: null, correctCount: 0 };
      renderLessonBody(material);
    };
  }

  function renderFinalQuiz(body, material) {
    const rt = state.quizRuntime;
    const questions = material.lesson.finalQuiz.questions;
    const q = questions[rt.index];
    const choicesHTML = q.choices.map((c, i) => {
      let cls = 'choice';
      if (rt.selected !== null) { if (i === q.correctIndex) cls += ' correct'; else if (i === rt.selected) cls += ' wrong'; }
      return `<button type="button" class="${cls}" data-choice="${i}" ${rt.selected !== null ? 'disabled' : ''}>${renderMathText(c)}</button>`;
    }).join('');
    body.innerHTML = `
      <div class="quiz-card">
        <div class="quiz-topline"><span>Final quiz — Q${rt.index + 1}/${questions.length}</span></div>
        <p class="quiz-question">${renderMathText(q.question)}</p>
        <div class="choices">${choicesHTML}</div>
        ${rt.selected !== null ? `
          <div class="feedback"><div class="xp-gain">${rt.selected === q.correctIndex ? `+${POINTS.finalCorrect} stars` : `+${POINTS.finalWrong} stars`}</div>${renderMathText(q.explanation)}</div>
          <button type="button" class="btn-primary" id="next-q-btn">${rt.index + 1 < questions.length ? 'Next question' : 'See results'}</button>
        ` : ''}
      </div>
    `;
    body.querySelectorAll('[data-choice]').forEach(btn => {
      btn.onclick = () => {
        if (rt.selected !== null) return;
        rt.selected = Number(btn.dataset.choice);
        if (rt.selected === q.correctIndex) rt.correctCount += 1;
        renderFinalQuiz(body, material);
      };
    });
    const nextBtn = document.getElementById('next-q-btn');
    if (nextBtn) nextBtn.onclick = () => {
      if (rt.index + 1 < questions.length) { rt.index += 1; rt.selected = null; renderFinalQuiz(body, material); }
      else finishFinalQuiz(material);
    };
  }

  async function finishFinalQuiz(material) {
    const rt = state.quizRuntime;
    const points = await recordFinalQuiz(material, rt.correctCount, material.lesson.finalQuiz.questions.length);
    state.quizMode = null; state.quizRuntime = null;
    renderApp();
    showPointsToast(points, 'Lesson complete');
  }

  function renderLessonComplete(body, material) {
    const fq = material.lesson.finalQuiz;
    const pct = fq.score ? Math.round((fq.score.correct / fq.score.total) * 100) : 0;
    body.innerHTML = `
      <div class="quiz-card result">
        <div class="result-label">Lesson complete</div>
        <div class="result-pct">${pct}%</div>
        <p class="muted">${escapeHTML(material.title)} is fully done. Nice work.</p>
        <button type="button" class="btn-primary" id="goto-timetable-btn">View timetable</button>
      </div>
    `;
    document.getElementById('goto-timetable-btn').onclick = () => { state.view = 'timetable'; renderApp(); };
  }

  // ---------- timetable tab ----------
  function renderTimetable(view) {
    const ready = state.materials.filter(m => m.lesson);
    if (ready.length === 0) { view.innerHTML = `<p class="empty-note">Nothing scheduled yet. Build today's plan from the Overview tab first.</p>`; return; }
    let totalItems = 0, doneItems = 0;
    ready.forEach(m => { totalItems += m.lesson.segments.length + 1; doneItems += m.lesson.segments.filter(s => s.completed).length + (m.lesson.finalQuiz.completed ? 1 : 0); });
    const pct = totalItems ? Math.round((doneItems / totalItems) * 100) : 0;
    view.innerHTML = `
      <div class="section-head"><h2>Today's timetable</h2><span class="count">${doneItems}/${totalItems} done</span></div>
      <div class="level-progress-track"><div class="level-progress-fill" style="width:${pct}%"></div></div>
      <div class="timetable-list" style="margin-top:16px;">${ready.map(m => timetableCardHTML(m)).join('')}</div>
    `;
  }

  function timetableCardHTML(m) {
    const segItems = m.lesson.segments.map((s, i) => `
      <li class="${s.completed ? 'done' : ''}">
        <span class="check">${s.completed ? '✓' : '○'}</span>
        <span class="tt-label">Segment ${i + 1}: ${escapeHTML(s.label)}</span>
        <span class="tt-pts">${s.completed ? `${s.pointsEarned}/${s.quiz.length * POINTS.segCorrect} pts` : `${s.quiz.length * POINTS.segCorrect} pts possible`}</span>
      </li>
    `).join('');
    const fq = m.lesson.finalQuiz;
    const finalMax = fq.questions.length * POINTS.finalCorrect + POINTS.completeBonus;
    const finalItem = `
      <li class="${fq.completed ? 'done' : ''}">
        <span class="check">${fq.completed ? '✓' : '○'}</span>
        <span class="tt-label">Final quiz</span>
        <span class="tt-pts">${fq.completed ? `${fq.pointsEarned}/${finalMax} pts` : `${finalMax} pts possible`}</span>
      </li>
    `;
    return `<div class="timetable-card"><h3>${escapeHTML(m.title)}</h3><ul class="checklist">${segItems}${finalItem}</ul></div>`;
  }

  // ---------- orbit tab ----------
  function countryOptionsHTML(selected) {
    return `<option value="">Select country</option>` + COUNTRIES.map(c => `<option value="${escapeHTML(c)}" ${c === selected ? 'selected' : ''}>${escapeHTML(c)}</option>`).join('');
  }

  function renderOrbit(view) {
    view.innerHTML = `
      <div class="section-head"><h2>Your constellation</h2></div>
      <div class="orbit-path" id="constellation-map"></div>

      <div class="section-head"><h2>Profile</h2></div>
      <div class="profile-form">
        <input type="text" id="orbit-name" placeholder="Display name" value="${escapeHTML(state.profile.displayName)}" />
        <select id="orbit-country">${countryOptionsHTML(state.profile.country)}</select>
        <button type="button" class="btn-primary" id="orbit-save-btn">Save &amp; join leaderboard</button>
      </div>
      ${!state.profile.displayName ? `<p class="hint">Set a name and country to appear on the leaderboard.</p>` : ''}

      <div class="section-head"><h2>Leaderboard</h2></div>
      <div class="lb-tabs">
        <button type="button" class="pill ${state.lbView !== 'country' ? 'active' : ''}" id="lb-global-btn">🌍 Global</button>
        <button type="button" class="pill ${state.lbView === 'country' ? 'active' : ''}" id="lb-country-btn">📍 My country</button>
      </div>
      <div id="leaderboard-list"></div>

      <p style="margin-top:30px;"><button type="button" class="file-btn" id="reset-btn">Reset my progress</button></p>
    `;
    renderConstellationMap();
    attachOrbitHandlers();
    loadLeaderboard();
  }

  function renderConstellationMap() {
    const el = document.getElementById('constellation-map');
    const points = state.profile.totalPoints;
    el.innerHTML = CONSTELLATIONS.map((c, i) => {
      const unlocked = points >= c.threshold;
      const current = unlocked && (i === CONSTELLATIONS.length - 1 || points < CONSTELLATIONS[i + 1].threshold);
      return `
        <div class="path-stop ${i % 2 === 0 ? 'stop-left' : 'stop-right'}">
          <div class="const-node ${unlocked ? 'unlocked' : 'locked'} ${current ? 'current' : ''}">
            ${constellationSVG(c.name, unlocked, current)}
            <div class="const-name">${escapeHTML(c.name)}</div>
            <div class="const-threshold">${c.threshold}+ stars</div>
          </div>
        </div>
      `;
    }).join('');
  }

  let resetArmed = false;
  function attachOrbitHandlers() {
    document.getElementById('orbit-save-btn').onclick = async () => {
      state.profile.displayName = document.getElementById('orbit-name').value.trim();
      state.profile.country = document.getElementById('orbit-country').value;
      await saveProfile(); await syncLeaderboard();
      renderOrbit(document.getElementById('view'));
    };
    document.getElementById('lb-global-btn').onclick = () => { state.lbView = 'global'; renderOrbit(document.getElementById('view')); };
    document.getElementById('lb-country-btn').onclick = () => { state.lbView = 'country'; renderOrbit(document.getElementById('view')); };
    const resetBtn = document.getElementById('reset-btn');
    resetBtn.onclick = () => {
      if (!resetArmed) { resetArmed = true; resetBtn.textContent = 'Click again to confirm reset'; setTimeout(() => { resetArmed = false; resetBtn.textContent = 'Reset my progress'; }, 4000); }
      else resetProgress();
    };
  }

  async function resetProgress() {
    for (const m of state.materials) await storageDelete(`material:${m.id}`);
    await storageDelete('materials-order');
    await storageDelete('profile');
    await storageDelete(`leaderboard:${state.userId}`, true);
    location.reload();
  }

  async function loadLeaderboard() {
    const listEl = document.getElementById('leaderboard-list');
    // This standalone build has no shared backend, so there's no real
    // multi-user leaderboard to fetch - showing fake entries would be
    // dishonest. Show the visitor's own local stats instead, with a clear
    // note about what's needed to make this genuinely live.
    if (!state.profile.displayName) {
      listEl.innerHTML = `<p class="empty-note">Set a name above to see your local stats here.</p>`;
      return;
    }
    listEl.innerHTML = `
      <ol class="lb-list">
        <li class="me">
          <span class="lb-rank">#1</span>
          <span class="lb-name">${escapeHTML(state.profile.displayName)} (you)</span>
          <span class="lb-country">${escapeHTML(state.profile.country || '')}</span>
          <span class="lb-pts">${state.profile.totalPoints} ⭐</span>
        </li>
      </ol>
      <p class="hint" style="margin-top:10px;">This standalone build has no shared backend, so this shows only your own local stats. A live global/country leaderboard needs a real server to pool scores across visitors.</p>
    `;
  }

  // ---------- init ----------
  async function initApp() {
    try {
      state.userId = await storageGet('user-id');
      if (!state.userId) { state.userId = crypto.randomUUID(); await storageSet('user-id', state.userId); }
      state.apiKey = (await storageGet('api-key')) || '';
      state.profile = (await storageGet('profile')) || defaultProfile();
      const seeded = await storageGet('seeded');
      let order = (await storageGet('materials-order')) || [];
      if (!seeded && order.length === 0) {
        // First visit: preload sample lessons so the app is explorable with
        // zero setup - no API key required to see how it all works.
        for (const m of SAMPLE_MATERIALS) await storageSet(`material:${m.id}`, m);
        order = SAMPLE_MATERIALS.map(m => m.id);
        await storageSet('materials-order', order);
        await storageSet('seeded', true);
      }
      const loaded = [];
      for (const id of order) { const m = await storageGet(`material:${id}`); if (m) loaded.push(m); }
      state.materials = loaded;
    } catch (e) {
      console.error('init failed, continuing without persistence', e);
      state.userId = state.userId || 'local';
      state.profile = state.profile || defaultProfile();
      if (state.materials.length === 0) state.materials = JSON.parse(JSON.stringify(SAMPLE_MATERIALS));
    }
    initVoices();
    renderApp();
  }

  document.getElementById('tab-nav').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn'); if (!btn) return;
    if (state.view === 'lesson') stopNarration();
    state.view = btn.dataset.tab;
    renderApp();
  });

  initDigits();
  initApp();
</script>
</body>
</html>
